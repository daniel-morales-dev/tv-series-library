name: secret-scan
# Busca secretos (tokens, claves, contraseñas) en todo el historial de git.
# GitHub ya bloquea el push con secret scanning push protection; esto además
# revisa lo que ya está dentro y avisa en cada PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Buscar secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          VERSION: v8.30.1
        run: |
          set -eu
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/$VERSION/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Escanear
        run: gitleaks git . --redact --no-banner --log-opts="--all" --exit-code 1
