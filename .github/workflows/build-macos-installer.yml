name: build-macos-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  # job publish: gh run download necesita actions: read; releases y comentarios usan contents/issues: write.
  actions: read
  contents: write
  issues: write

env:
  NODE_VERSION: "24.14.0"
  # The prod tree of apps/server is ~15 MB; anything near the dev tree (52 MB+) fails the build.
  MAX_NODE_MODULES_KB: "40000"
  # macOS builds of ffmpeg, versioned by directory; the official .sha256 lives beside each zip.
  FF_ORIGIN: "https://ffmpeg.martin-riedl.de"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # node_sha cross-checked against https://nodejs.org/dist/v24.14.0/SHASUMS256.txt
          - runner: macos-latest
            arch: arm64
            nodearch: arm64
            node_sha: "a1a54f46a750d2523d628d924aab61758a51c9dad3e0238beb14141be9615dd3"
            ff_dir: "macos/arm64/1789931890_9.0.2"
            ffmpeg_sha: "c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924"
            ffprobe_sha: "fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6"
          # macos-13 (Intel) is retired; macos-15-intel is the supported Intel label.
          - runner: macos-15-intel
            arch: x64
            nodearch: x64
            node_sha: "f2879eb810e25993a0578e5d878930266fd2eafcffe9f2839b3d8db354d4879e"
            ff_dir: "macos/amd64/1789931006_9.0.2"
            ffmpeg_sha: "7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4"
            ffprobe_sha: "2322438ed2f6319a691291b247d09c69dcaa3a982460d1f269a7e1af335cfdfd"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.14.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web (apps/web/dist)
        run: npm run build -w apps/web

      - name: Stage payload
        run: |
          set -euo pipefail
          PAYLOAD=packaging/macos/payload
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD/node/bin" "$PAYLOAD/ffmpeg/bin" "$PAYLOAD/apps/server" "$PAYLOAD/apps/web" "$PAYLOAD/scripts"
          cp -R apps/server/src "$PAYLOAD/apps/server/src"
          cp apps/server/package.json "$PAYLOAD/apps/server/package.json"
          cp package.json "$PAYLOAD/package.json"
          cp scripts/dev.mjs "$PAYLOAD/scripts/dev.mjs"
          cp -R apps/web/dist "$PAYLOAD/apps/web/dist"

          # Prod deps of apps/server only: npm ci -w apps/server installs the web tree too, so the
          # install runs in an isolated workspace that declares apps/server and nothing else.
          STAGE="$RUNNER_TEMP/sala-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/apps/server"
          printf '{\n  "name": "sala-staging",\n  "private": true,\n  "type": "module",\n  "workspaces": ["apps/server"]\n}\n' > "$STAGE/package.json"
          cp apps/server/package.json "$STAGE/apps/server/package.json"
          (cd "$STAGE" && npm install --omit=dev --no-audit --no-fund)
          rm -rf "$STAGE/node_modules/.bin" "$STAGE/node_modules/@tv-series-library"
          if find "$STAGE/node_modules" -type l | grep -q .; then
            echo "::error::staged node_modules contains symlinks; refusing to package"
            exit 1
          fi
          SIZE_KB=$(du -sk "$STAGE/node_modules" | cut -f1)
          echo "staged apps/server node_modules: ${SIZE_KB} KB (limit ${MAX_NODE_MODULES_KB} KB)"
          if [ "$SIZE_KB" -gt "$MAX_NODE_MODULES_KB" ]; then
            echo "::error::staged node_modules is ${SIZE_KB} KB: the dev tree leaked into the payload"
            exit 1
          fi
          cp -R "$STAGE/node_modules" "$PAYLOAD/apps/server/node_modules"

          du -sh "$PAYLOAD"

      - name: Download Node portable (verified)
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/node.tar.gz"
          NAME="node-v${NODE_VERSION}-darwin-${{ matrix.nodearch }}.tar.gz"
          curl -fsSL -o "$TARBALL" "https://nodejs.org/dist/v${NODE_VERSION}/${NAME}"
          echo "${{ matrix.node_sha }}  $TARBALL" | shasum -a 256 -c -
          curl -fsSL -o "$RUNNER_TEMP/SHASUMS256.txt" "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep -E " ${NAME}$" "$RUNNER_TEMP/SHASUMS256.txt" | grep -q "^${{ matrix.node_sha }} "
          echo "node tarball matches SHASUMS256.txt"
          mkdir -p "$RUNNER_TEMP/node"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/node"
          cp "$RUNNER_TEMP/node/node-v${NODE_VERSION}-darwin-${{ matrix.nodearch }}/bin/node" packaging/macos/payload/node/bin/node
          chmod 755 packaging/macos/payload/node/bin/node
          ls -l packaging/macos/payload/node/bin/node

      - name: Download ffmpeg and ffprobe (verified)
        run: |
          set -euo pipefail
          for tool in ffmpeg ffprobe; do
            case "$tool" in
              ffmpeg) SHA="${{ matrix.ffmpeg_sha }}" ;;
              ffprobe) SHA="${{ matrix.ffprobe_sha }}" ;;
            esac
            ZIP="$RUNNER_TEMP/$tool.zip"
            curl -fsSL -o "$ZIP" "$FF_ORIGIN/download/${{ matrix.ff_dir }}/$tool.zip"
            echo "$SHA  $ZIP" | shasum -a 256 -c -
            # Cross-check the pinned hash against the official .sha256 published beside the zip.
            curl -fsSL -o "$ZIP.sha256" "$FF_ORIGIN/download/${{ matrix.ff_dir }}/$tool.zip.sha256"
            grep -q "$SHA" "$ZIP.sha256"
            unzip -oq "$ZIP" -d "$RUNNER_TEMP/$tool-extract"
            BIN=$(find "$RUNNER_TEMP/$tool-extract" -name "$tool" ! -type d -print -quit)
            if [ -z "$BIN" ]; then
              echo "::error::$tool.zip does not contain a $tool binary"
              exit 1
            fi
            cp "$BIN" "packaging/macos/payload/ffmpeg/bin/$tool"
            chmod 755 "packaging/macos/payload/ffmpeg/bin/$tool"
          done
          file packaging/macos/payload/ffmpeg/bin/ffmpeg packaging/macos/payload/ffmpeg/bin/ffprobe
          for tool in ffmpeg ffprobe; do
            if ! file "packaging/macos/payload/ffmpeg/bin/$tool" | grep -q "Mach-O"; then
              echo "::error::$tool is not a Mach-O executable"
              exit 1
            fi
          done
          ls -l packaging/macos/payload/ffmpeg/bin/

      - name: Compute version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.$(git rev-parse --short=7 HEAD)"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app and DMG (ad-hoc signed)
        run: bash packaging/macos/build.sh "${{ matrix.arch }}"

      - name: Verify ad-hoc signature
        run: codesign --verify --strict packaging/macos/Sala.app

      - name: Smoke test (launcher starts the server, health responds)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sala-home"
          if ! HOME="$RUNNER_TEMP/sala-home" bash "packaging/macos/Sala.app/Contents/MacOS/sala" --no-open --no-agent; then
            echo "launcher failed; server log:"
            tail -n 80 "$RUNNER_TEMP/sala-home/Library/Logs/sala/server.log" || true
            exit 1
          fi
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8080/api/health

      # Siempre apaga el node del smoke test, aunque un paso anterior haya fallado.
      - name: Stop smoke server
        if: always()
        run: pkill -f "Sala.app/Contents/Resources/sala" || true

      - name: Upload installer
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sala-macos-installer-${{ matrix.arch }}
          path: packaging/macos/output/*.dmg
          if-no-files-found: error

      # A mention from the user's own token never notifies; this one is posted by
      # github-actions[bot], which does notify the owner by email and push.
      - name: Notify owner (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/issues/1/comments" \
            -f body="@daniel-morales-dev La compilacion del instalador de macOS (${{ matrix.arch }}) fallo. Detalles: ${RUN_URL}"

  # Publica los DMG en la release del tag, sin autenticacion manual (los artifacts expiran y piden login).
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # gh resuelve el repositorio desde el remoto git: sin checkout, gh run/release fallan.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n sala-macos-installer-arm64 -D dmg-arm64
          gh run download "$GITHUB_RUN_ID" -n sala-macos-installer-x64 -D dmg-x64

      - name: Write SHA256SUMS-macos.txt
        run: |
          set -euo pipefail
          shasum -a 256 dmg-arm64/*.dmg dmg-x64/*.dmg > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Publish release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "sala $TAG" \
            --notes "Instaladores adjuntos: Windows (sala-setup.exe) y macOS (sala-macos-arm64.dmg / sala-macos-x64.dmg). Verifica los SHA256SUMS*.txt." || true
          gh release upload "$TAG" dmg-arm64/*.dmg dmg-x64/*.dmg SHA256SUMS-macos.txt --clobber
          # Al recrear un tag, GitHub deja la release previa como draft: republicar es idempotente.
          gh release edit "$TAG" --draft=false || true

      - name: Notify owner (success)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh api "repos/${{ github.repository }}/issues/1/comments" \
            -f body="@daniel-morales-dev Instalador de macOS listo (v${VERSION}). Descarga directa desde Assets: ${RELEASE_URL} (sala-macos-arm64.dmg, sala-macos-x64.dmg + SHA256SUMS-macos.txt). Log del build: ${RUN_URL}"

      - name: Notify owner (publish failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/issues/1/comments" \
            -f body="@daniel-morales-dev La publicacion de los DMG de macOS (v${GITHUB_REF_NAME#v}) fallo; la release quedo sin instalador de macOS. Detalles: ${RUN_URL}"
